[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mazegen-maroard-almanier"
version = "0.1.0"
description = "Reusable maze generator for the 42 A-Maze-ing project."
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "maroard" },
    { name = "almanier" },
]
dependencies = []

[project.optional-dependencies]
dev = [
    "build>=1.0",
    "flake8>=6.0",
    "mypy>=1.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["mazegen_maroard_almanier*"]
